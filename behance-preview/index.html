<style>
  /* No Britanica — the mark is outlines now. */

  :root {
    --ink: #0e0f12;
    --panel: #16181c;
    --panel-hi: #1c1f24;
    --paper: #ecedea;
    --dim: #7b828d;
    --line: rgba(236, 237, 234, 0.1);
    --line-strong: rgba(236, 237, 234, 0.22);
    --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --scroll: #00e5ff;
    --gutter: 40px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .icon { flex: none; display: block; }

  .stencil {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- nav ---------- */

  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(14, 15, 18, 0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }

  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 var(--gutter);
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  /*
   * The house mark, as outlines rather than clipped type.
   *
   * It was Britanica at 38px with clip-path: inset(0 0 50% 0), plus
   * margin-bottom: -0.5em to win back the clipped space, plus a measured
   * top: -0.062em to lift the visible ink onto the nav's centre line. That
   * last correction is the tell: a percentage clip is taken from the line
   * box, and the box carries ascender space the clip doesn't remove, so the
   * ink always sat low and had to be nudged back by hand.
   *
   * The SVG's viewBox is the ink itself, so there is nothing to nudge, no
   * space to win back, and no percentage to keep in step with a font-size.
   * It also drops the Britanica @font-face — the face was here for this one
   * word.
   *
   * Regenerate from _tools/wordmark (see its README). Width reproduces the
   * old 38px setting: 3229 units of advance at 38px is 123px.
   */
  .mark {
    display: block;
    width: 123px;
    color: var(--paper);
    text-decoration: none;
    transition: opacity 0.3s ease;
  }

  .mark svg { display: block; width: 100%; height: auto; }

  .mark:hover { opacity: 0.7; }
  .mark:focus-visible { opacity: 1; }

  /* ---------- now playing ---------- */
  /*
   * A play control and a hairline, sat at the end of the nav. Deliberately
   * quiet: dim until you touch it, and the seek thumb only appears on hover
   * or focus, so at rest it reads as a rule rather than a widget.
   */
  .np { display: flex; align-items: center; gap: 10px; margin-left: 18px; }

  /*
   * `display: flex` on .np outranks the user-agent's [hidden] { display: none }
   * — one class beats an attribute selector in the UA sheet — so setting the
   * attribute alone would not hide it. Kept so `hidden` behaves if it is ever
   * used again, even though the control now stays visible by default.
   */
  .np[hidden] { display: none; }

  /* Nothing behind it yet: still drawn, but not offering a pointer. */
  .np-toggle[aria-disabled="true"] { cursor: default; }
  .np-toggle[aria-disabled="true"]:hover { color: var(--dim); }

  .np-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; padding: 0;
    background: none; border: 0; cursor: pointer;
    color: var(--dim);
    transition: color 0.2s ease;
  }
  .np-toggle:hover { color: var(--paper); }
  .np-toggle:focus-visible { outline: 1px solid var(--paper); outline-offset: 3px; color: var(--paper); }

  .np-icon { width: 15px; height: 15px; fill: currentColor; display: block; }
  .np-icon--pause { display: none; }
  .np.is-playing .np-icon--play { display: none; }
  .np.is-playing .np-icon--pause { display: block; }
  .np.is-playing .np-toggle { color: var(--paper); }

  /*
   * A range input rather than a div, so seeking works from the keyboard for
   * free. Styled down to a 2px rule; the fill is painted with a gradient
   * driven by --np-progress, which the script updates.
   */
  .np-seek {
    -webkit-appearance: none; appearance: none;
    width: 72px; height: 2px; margin: 0; padding: 0;
    border-radius: 1px; cursor: pointer; outline: none;
    --np-progress: 0%;
    background: linear-gradient(to right,
      var(--paper) 0%, var(--paper) var(--np-progress),
      rgba(255,255,255,0.16) var(--np-progress), rgba(255,255,255,0.16) 100%);
    transition: width 0.2s ease;
  }
  .np-seek:focus-visible { outline: 1px solid var(--paper); outline-offset: 4px; }

  .np-seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--paper); border: 0; cursor: pointer;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .np-seek::-moz-range-thumb {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--paper); border: 0; cursor: pointer;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .np:hover .np-seek::-webkit-slider-thumb,
  .np-seek:focus-visible::-webkit-slider-thumb { opacity: 1; }
  .np:hover .np-seek::-moz-range-thumb,
  .np-seek:focus-visible::-moz-range-thumb { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .np-toggle, .np-seek, .np-seek::-webkit-slider-thumb { transition: none; }
  }

  .nav-links { display: flex; gap: 4px; }

  .nav-link {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 2px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .nav-link:hover { color: var(--paper); background: rgba(236, 237, 234, 0.05); }
  .nav-link.is-on { color: var(--paper); background: rgba(236, 237, 234, 0.08); }

  /* ---------- shared page furniture ---------- */

  .page { padding: 56px 0 110px; }
  /* A banner runs to the top of the page; the standard padding would inset it. */
  .page.has-hero { padding-top: 0; }
  .page-head { margin-bottom: 38px; }

  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
    margin: 12px 0 0;
  }

  .lede {
    color: var(--dim);
    font-size: 14px;
    line-height: 1.65;
    max-width: 60ch;
    margin-top: 16px;
  }

  /* ---------- work grid ---------- */

  .section-rule {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 20px;
  }
  .section-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 28px;
    margin-bottom: 56px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 11px;
    text-decoration: none;
    color: inherit;
  }

  /*
   * No border where there is a picture. A translucent white hairline reads as
   * nothing over dark artwork and as a glowing ring over bright artwork, so
   * the same rule made cards look inconsistent. An image has its own edge; the
   * hairline is only needed where there is nothing to see.
   */
  .cover {
    position: relative;
    aspect-ratio: 808 / 632;
    border-radius: 3px;
    overflow: hidden;
    background: var(--accent, var(--panel));
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cover.is-empty { border: 1px solid var(--line); }
  .card:hover .cover {
    transform: translateY(-3px);
    /* Outside the box, so it never sits over the artwork. */
    box-shadow: 0 0 0 1px var(--line-strong), 0 12px 26px rgba(0, 0, 0, 0.4);
  }
  .cover img {
    /* Out of flow so the image cannot set the box height, and inset a hair so
       no sliver of the accent background shows at the rounded corners. */
    position: absolute;
    inset: -1px;
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    object-fit: cover;
    display: block;
  }

  .card-kind {
    position: absolute;
    top: 9px;
    left: 9px;
    padding: 4px 7px;
    border-radius: 2px;
    background: rgba(14, 15, 18, 0.78);
    backdrop-filter: blur(4px);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper);
  }

  .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .card-tag {
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
  }

  /* The tag row: what the work is about, as a way through it. */
  .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 30px; }
  .tag-chip {
    padding: 6px 11px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tag-chip:hover { color: var(--paper); border-color: var(--line-strong); }
  .tag-chip.is-on { color: var(--ink); background: var(--paper); border-color: var(--paper); }
  .tag-count { opacity: 0.5; font-variant-numeric: tabular-nums; }
  .tag-chip.is-more { border-style: dashed; }

  /* ---------- project page ---------- */

  .back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    margin-bottom: 26px;
  }
  .back:hover { color: var(--paper); }

  /*
   * The cover as a full-bleed banner: blurred, so it reads as atmosphere
   * rather than as an image you are meant to study, with the ink rising from
   * the floor to carry the title. The ramp lives in the gradient, not in a
   * mask over flat ink — masking one attenuates the whole band and the scrim
   * lands at a fraction of the weight it was written at.
   */
  .hero {
    position: relative;
    display: flex;
    align-items: flex-end;
    min-height: 54vh;
    margin-bottom: 44px;
    overflow: hidden;
    background: var(--accent, var(--panel));
  }

  .hero-media {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /*
   * Flat ink across the whole banner instead of a blur: the cover stays sharp
   * and readable, and the darkening is what sits the title on top of it.
   */
  .hero-media::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(14, 15, 18, 0.6);
  }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    /* Eased off now the flat tint carries most of the darkening — this only
       has to deepen the floor the words sit on. */
    background: linear-gradient(
      to top,
      var(--ink) 0%,
      rgba(14, 15, 18, 0.86) 22%,
      rgba(14, 15, 18, 0.4) 55%,
      transparent 100%
    );
  }

  .hero-body {
    position: relative;
    z-index: 2;
    width: 100%;
    padding-top: 96px;
    padding-bottom: 46px;
  }

  .hero-back {
    position: absolute;
    top: 26px;
    left: 0;
    right: 0;
    z-index: 2;
  }

  /* Half the page, not a text measure: the banner is full width, so a column
     of 62 characters under it read as an afterthought. */
  .project-head { max-width: 50%; }
  @media (max-width: 860px) { .project-head { max-width: 100%; } }

  /*
   * The case study and the column that describes it. The wrap is 1400 and the
   * modules capped at 1100, so this column stands in space that was already
   * empty — the pictures are the same size they always were.
   */
  .case {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 250px;
    gap: 46px;
    align-items: start;
  }
  /*
   * Prose reads at a measure, so a post's column is that measure rather than
   * whatever is left over — and the two columns are then pushed apart instead
   * of leaving a hole between the text and the sidebar. A case study's images
   * still take everything they can get, which is why this is a variant.
   */
  .case.is-post {
    grid-template-columns: minmax(0, 70ch) 250px;
    gap: 60px;
    /* Packed left, with the room left over on the right — the same shape as
       the Work lede and a project's standfirst. Pushed to opposite ends they
       were the right width each and a hole between them. */
    justify-content: start;
  }

  .case-side {
    position: sticky;
    top: 28px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    /*
     * No rule down the left. The list already carries hairlines across it, and
     * a vertical one cutting through them is a second, competing grid — one
     * that also has to stop somewhere arbitrary, since the column is only as
     * tall as what is in it. The gap does the separating.
     */
  }
  /*
   * Below this the column has nowhere to stand, so it goes under the case
   * study rather than above it: on a phone you want the work first, and the
   * specification after it.
   */
  @media (max-width: 1000px) {
    /*
     * .case.is-post has to be named here as well. A media query does not raise
     * specificity — .case alone (0,1,0) never beat .case.is-post (0,2,0), so a
     * post kept its two columns all the way down and its text ended up in a
     * 260px gutter beside the related list.
     */
    .case,
    .case.is-post { grid-template-columns: 1fr; gap: 0; }
    .case-side {
      position: static;
      order: 2;
      margin-top: 52px;
      /* The list rules itself top and bottom, so it needs no border of its own
         here — space is enough to separate it from the work above. */
    }
    .case-body { order: 1; }
  }

  /*
   * When and what with: a band under the title, where they have always been.
   * They belong to the project as a whole rather than to the case study beside
   * them, and as a column they were taller than the title, leaving a hole.
   */
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 26px 52px;
    padding: 22px 0 26px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 44px;
  }
  .fact { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .fact-value { font-size: 13px; line-height: 1.5; }

  /*
   * What the thing actually does. Written here rather than synced — Behance has
   * no field for it — so it is absent on everything nobody has written it for,
   * which is most of the illustration work.
   *
   * Set as a numbered specification rather than a bulleted list: the page is
   * already full of mono numerals and hairlines, and a list of dashes read as
   * an afterthought pinned beside the work instead of a statement about it.
   */
  .features { display: flex; flex-direction: column; }
  .features > .stencil { padding-bottom: 14px; }

  .feature-list {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: feature;
  }
  .feature-list li {
    counter-increment: feature;
    display: grid;
    /* The number is a fixed gutter so every line of every item aligns to the
       same left edge — a hanging indent, which is what makes it read as a
       specification rather than as wrapped prose. */
    grid-template-columns: 26px minmax(0, 1fr);
    padding: 13px 0;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 1.5;
    color: rgba(236, 237, 234, 0.88);
  }
  /* The last rule closes the list, so it reads as a block rather than trailing
     off into the page. */
  .feature-list li:last-child { border-bottom: 1px solid var(--line); }
  .feature-list li::before {
    content: counter(feature, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    /* Sits on the first line's baseline rather than its box top, which is a
       couple of pixels higher and looks like a mistake at this size. */
    padding-top: 3px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--paper);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { border-color: var(--paper); background: rgba(236, 237, 234, 0.06); }
  .btn-solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .btn-solid:hover { background: #fff; color: var(--ink); }

  /*
   * The steps run 12 / 8 / 28: label, title, the sentence tucked under it, then
   * the things you can do about it. The sentence belongs to the title, so it
   * sits close; the buttons are a separate thought and get the air.
   */
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

  .project-head .lede { margin-top: 8px; max-width: none; }

  /* Half the page, matching a project's standfirst. A 60-character measure
     under a full-width heading read as a narrow column beside empty space. */
  .page-head .lede { max-width: 50%; }
  @media (max-width: 860px) { .page-head .lede { max-width: 100%; } }

  .modules { display: flex; flex-direction: column; gap: 22px; }

  /*
   * A justified row. flex-basis: 0 with a growth factor per item is what makes
   * every picture come out the same height while keeping its own proportions —
   * the widths divide up in the ratio Behance recorded, and the heights follow.
   */
  .collection { display: flex; gap: 12px; align-items: flex-start; }
  /* Rows of one block sit closer to each other than separate modules do —
     it is one picture broken into pieces, not a series. */
  .collection + .collection { margin-top: 12px; }
  /*
   * The box holds its shape before the picture arrives. A lazily loaded image
   * has no height until it loads, so without this the whole row is nothing at
   * all until you scroll to it — and then everything below it jumps.
   */
  .collection-item { flex: 1 1 0; min-width: 0; }
  .collection-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Four posters across a phone is four thumbnails. One at a time instead. */
  /*
   * A grid stays a grid on a phone — forty squares stacked one per screen is a
   * scroll nobody finishes. Rows wrap into pairs instead, and only a row that
   * was always a handful of large pieces goes to one at a time.
   */
  @media (max-width: 720px) {
    .collection { flex-wrap: wrap; }
    .collection-item { flex: 1 1 40%; }
  }

  /* Next and previous, so a project is not a dead end. */
  .pager {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .pager a {
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-decoration: none;
    max-width: 45%;
  }
  .pager a:last-child { text-align: right; align-items: flex-end; }
  .pager-name { font-size: 14px; font-weight: 600; }
  .pager a { transition: color 0.15s ease; }
  .pager a:hover .stencil { color: var(--paper); }
  .module-image, .module-video {
    width: 100%;
    /* Without this a width/height attribute pair is taken literally and the
       image is stretched to it. */
    height: auto;
    border: 1px solid var(--line);
    border-radius: 3px;
    display: block;
  }
  .module-text {
    font-size: 15px;
    line-height: 1.7;
    color: rgba(236, 237, 234, 0.86);
    max-width: 68ch;
  }
  .module-text a { color: var(--paper); }
  .caption { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 7px; }

  /* ---------- the undo stack ---------- */

  .posts { display: flex; flex-direction: column; }

  .post-row {
    display: block;
    padding: 26px 0;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .post-row:last-child { border-bottom: 1px solid var(--line); }
  /*
   * Hover brightens rather than underlines. Nothing else on the site underlines
   * on hover — a link brightens from dim towards paper, and a card lifts — so
   * the rule was the odd one out, and an underline under a 21px heading is a
   * heavy thing to draw for a state that only says "you are here".
   */
  .post-row { transition: border-color 0.15s ease, background 0.15s ease; }
  .post-row:hover { border-color: var(--line-strong); }
  .post-row:hover .post-when { color: var(--paper); }
  .post-row:hover .post-excerpt { color: rgba(236, 237, 234, 0.78); }

  .post-when {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    transition: color 0.15s ease;
  }
  .post-title {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 9px 0 8px;
    max-width: 34ch;
  }
  .post-excerpt {
    font-size: 14px;
    line-height: 1.65;
    color: var(--dim);
    max-width: 68ch;
    transition: color 0.15s ease;
  }
  .post-tags { margin-top: 12px; }

  /*
   * Written prose, wherever it appears: a post and the About page are the same
   * kind of thing on the page, so they are the same thing here. About used to
   * carry its own near-copy of these rules — a point smaller, a shade dimmer,
   * and headings set as mono labels rather than headings, so the two pages read
   * as though they came from different sites.
   *
   * It reads at a measure, not across the whole grid.
   */
  .prose {
    max-width: 68ch;
    font-size: 16px;
    line-height: 1.75;
    color: rgba(236, 237, 234, 0.88);
  }
  .prose p { margin-bottom: 20px; }
  .prose h2, .prose h3 {
    /* The site's grey, the one the stencil labels are set in. A heading in full
       paper competed with the page title above it; in grey it reads as a marker
       within the writing rather than a second title. */
    color: var(--dim);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 34px 0 12px;
  }
  /* A fourth level, and the two marks the editor can now insert. */
  .prose h4 {
    color: var(--dim);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 26px 0 10px;
  }
  .prose code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: rgba(236, 237, 234, 0.07);
    padding: 1px 5px;
    border-radius: 2px;
  }
  .prose hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 34px 0;
  }
  /* A picture placed in a post, and the line under it. */
  .prose figure { margin: 28px 0; }
  .prose img { width: 100%; height: auto; display: block; border-radius: 2px; }
  .prose figcaption {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-top: 8px;
  }
  .prose ul, .prose ol { margin: 0 0 20px; padding-left: 20px; }
  .prose li { margin-bottom: 8px; }
  .prose a { color: var(--paper); text-underline-offset: 3px; }
  .prose blockquote {
    margin: 24px 0;
    padding-left: 18px;
    border-left: 2px solid var(--line-strong);
    color: var(--dim);
  }
  .prose strong { color: var(--paper); }

  /* Beside the piece you are reading — the same sticky column the projects
     use, carrying what to read next instead of what a project was made with. */
  .more-posts { display: flex; flex-direction: column; }
  .more-posts .stencil { padding-bottom: 14px; }
  .more-list { margin: 0; padding: 0; list-style: none; }
  .more-list li { border-top: 1px solid var(--line); }
  .more-list li:last-child { border-bottom: 1px solid var(--line); }
  .more-list a {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 13px 0;
    text-decoration: none;
    color: inherit;
  }
  .more-title { font-size: 13px; line-height: 1.4; color: rgba(236, 237, 234, 0.88); }
  .more-list a { transition: color 0.15s ease; }
  .more-list a:hover .more-title { color: var(--paper); }
  .more-list a:hover .more-when { color: rgba(236, 237, 234, 0.6); }
  .more-when {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .post-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 18px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px;

  /* ---------- about ---------- */

  .about {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 60px;
    align-items: start;
  }
  @media (max-width: 900px) { .about { grid-template-columns: 1fr; gap: 40px; } }

  /*
   * The one thing About has that a post does not: a standfirst above the
   * writing, set larger. Everything else it takes from .prose.
   *
   * Chosen by position rather than by a class, because the class did not
   * survive being edited — the rich editor drops every attribute on the way
   * out, so a hook written into the body copy is gone the first time anyone
   * saves. Opening the page with a paragraph is a thing you can do; remembering
   * to keep an invisible class on it is not.
   */
  .about-copy > p:first-child {
    font-size: 19px;
    line-height: 1.45;
    color: var(--paper);
    font-weight: 600;
    margin-bottom: 24px;
  }

  .about-side { display: flex; flex-direction: column; gap: 34px; }
  .about-block { display: flex; flex-direction: column; gap: 12px; }

  .socials { display: flex; flex-direction: column; gap: 2px; }
  .social {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    text-decoration: none;
    color: var(--paper);
    transition: color 0.15s ease;
  }
  .social:hover { color: var(--dim); }

  /* Twenty-five years of it, so a dense list rather than a spaced one. */
  /*
   * A full-width index of the work, in as many columns as the page has room
   * for. Columns rather than a grid because the list is ordered — reading it
   * down one column and on to the next keeps the years in sequence, which a
   * grid flowing across would scramble.
   */
  .worked {
    display: block;
    margin-top: 72px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
  }
  .worked .stencil { display: block; margin-bottom: 18px; }
  .worked .history {
    columns: 3;

  }
  @media (max-width: 1000px) { .worked .history { columns: 2; } }
  @media (max-width: 640px) { .worked .history { columns: 1; } }
  /* A row must not be split down the middle by a column break. */
  .worked .history li { break-inside: avoid; }

  .history { margin: 0; padding: 0; list-style: none; }
  .history li {
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr);
    gap: 10px;
    padding: 5px 0;
    font-size: 12px;
    line-height: 1.4;
  }
  .history-year { font-family: var(--mono); font-size: 10px; color: var(--dim); padding-top: 1px; }
  .history-name { color: rgba(236, 237, 234, 0.78); }

  /* ---------- states ---------- */

  .empty {
    padding: 40px;
    border: 1px dashed var(--line);
    border-radius: 3px;
    color: var(--dim);
    font-size: 14px;
    line-height: 1.65;

  .empty b { color: var(--paper); font-weight: 600; }

  footer {

  }
  .footer-row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }
  .footer-socials { display: flex; flex-wrap: wrap; gap: 18px; }
  .footer-social {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--dim); text-decoration: none;
  }
  .footer-social:hover { color: var(--paper); }

  /* ---------- scrollbars ---------- */

  /*
   * A hairline of cyan and nothing else — no track, no buttons, no gutter you
   * can see when there is nothing to scroll.
   *
   * Firefox has no 1px option: scrollbar-width takes auto | thin | none, so it
   * gets `thin` (about 8px there) with the same colours. Naming a width at all
   * also opts WebKit out of overlay scrollbars, which is why the track is set
   * transparent rather than left alone — otherwise it would draw a permanent
   * pale strip down the side of every page.
   */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
  }
  ::-webkit-scrollbar { width: 1px; height: 1px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 0; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ---------- small screens ---------- */

  /*
   * The nav and the footer had no breakpoint at all. At 390px the mark, a 24px
   * gap and three tracked-out links come to more than the screen, so the links
   * were being pushed off the end of it — and the footer's two halves, set to
   * sit at opposite ends of a row, had nowhere to be opposite.

  @media (max-width: 700px) {

    :root { --gutter: 20px; }

    .nav-inner { height: 56px; gap: 10px; }
    /* Size only. The clip and the margin are in em, so they follow. */
    .mark { width: 97px; }
    .nav-links { gap: 1px; }
    /* No room for the hairline once the links tighten up; the button stays. */
    .np { margin-left: 10px; }
    .np-seek { display: none; }
    .nav-link {
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 8px 8px;
    }

    /* Two ends of a row need a row. Stacked, with the links under the line
       they belong to. */
    .footer-row { flex-direction: column; gap: 14px; }
    .footer-socials { gap: 16px 20px; }

    /* 34px over two or three lines is a wall on a phone. */
    h1 { font-size: 27px; letter-spacing: -0.03em; }

    /* One card at a time rather than a 290px minimum that forces a sideways
       scroll at 350px of usable width. */
    .grid { grid-template-columns: 1fr; gap: 22px; margin-bottom: 40px; }

    /* Half a phone screen of banner before a word of the project. */
    .hero { min-height: 42vh; }
  }

/*
 * Now playing.
 *
 * One track, self-hosted, never autoplayed. Deliberately not YouTube: their
 * IFrame API requires the player to stay visible and at least 200x200, so a
 * bare progress bar would be against the terms — and a visitor without
 * Premium can be served a pre-roll advert, which on a portfolio is worse
 * than having no music at all.
 *
 * The control hides itself unless the audio actually loads. A play button
 * that does nothing is worse than no button, and this way the file can be
 * added or removed on the server without touching the page.
 */
(function () {
  var SRC = '/audio/mix.mp3';
  var POS_KEY = 'crbntyp:np:pos';

  var np = document.getElementById('np');
  var toggle = document.getElementById('np-toggle');
  var seek = document.getElementById('np-seek');
  if (!np || !toggle || !seek) return;

  var audio = new Audio();
  audio.preload = 'metadata';   // enough to size the bar, not the whole file
  audio.src = SRC;

  var ready = false;

  audio.addEventListener('loadedmetadata', function () {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    ready = true;
    toggle.removeAttribute('aria-disabled');
    seek.removeAttribute('aria-disabled');

    // Pick up where this visitor left off, but never start playing on its own.
    var saved = parseFloat(localStorage.getItem(POS_KEY) || '0');
    if (saved > 0 && saved < audio.duration - 1) {
      audio.currentTime = saved;
      paint();
    }
  });

  // Missing file, wrong codec, blocked request. The control stays on screen —
  // it is part of the nav's composition — but says so to assistive tech and
  // does nothing when clicked, rather than pretending to play.
  audio.addEventListener('error', function () {
    ready = false;
    toggle.setAttribute('aria-disabled', 'true');
    seek.setAttribute('aria-disabled', 'true');
  });

  function paint() {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    var ratio = audio.currentTime / audio.duration;
    seek.value = Math.round(ratio * 1000);
    seek.style.setProperty('--np-progress', (ratio * 100).toFixed(2) + '%');
  }

  audio.addEventListener('timeupdate', function () {
    paint();
    // Throttled by the browser's own timeupdate rate (~4/s), which is a fine
    // granularity to resume from and cheap enough to write.
    try { localStorage.setItem(POS_KEY, String(audio.currentTime)); } catch (e) {}
  });

  audio.addEventListener('ended', function () {
    np.classList.remove('is-playing');
    toggle.setAttribute('aria-pressed', 'false');
    toggle.setAttribute('aria-label', 'Play music');
    try { localStorage.removeItem(POS_KEY); } catch (e) {}
  });

  toggle.addEventListener('click', function () {
    if (!ready) return;   // nothing behind it yet
    if (audio.paused) {
      audio.play().then(function () {
        np.classList.add('is-playing');
        toggle.setAttribute('aria-pressed', 'true');
        toggle.setAttribute('aria-label', 'Pause music');
      }).catch(function () {
        // Autoplay policy or a decode failure. Nothing useful to say on a
        // portfolio — leave the button in its resting state.
      });
    } else {
      audio.pause();
      np.classList.remove('is-playing');
      toggle.setAttribute('aria-pressed', 'false');
      toggle.setAttribute('aria-label', 'Play music');
    }
  });

  seek.addEventListener('input', function () {
    if (!isFinite(audio.duration)) return;
    audio.currentTime = (seek.value / 1000) * audio.duration;
    seek.style.setProperty('--np-progress', (seek.value / 10).toFixed(2) + '%');
  });
})();

const view = document.getElementById('view');
const escape = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let listCache = null;

/** A category's label, for anywhere the site names one. */
const categoryLabel = (slug) =>
  (listCache?.categories ?? []).find((c) => c.slug === slug)?.label ?? slug;
async function work() {
  if (!listCache) {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`the work could not be read (HTTP ${res.status})`);
    listCache = await res.json();
  }
  return listCache;
}

const projects = async () => (await work()).items;

function card(project) {
  const when = project.published ? monthYear.format(new Date(project.published * 1000)) : '';
  const live = liveFor(project);
  return `
    <a class="card" href="#/project/${project.id}">
      <span class="cover${project.cover ? '' : ' is-empty'}" style="--accent:${escape(project.accent || 'transparent')}">
        ${project.cover ? `<img src="${escape(project.cover)}" alt="" loading="lazy">` : ''}
        ${project.kind ? `<span class="card-kind">${escape(categoryLabel(project.kind))}</span>` : ''}
      </span>
      <span class="meta">
        <span class="name">${escape(project.name)}</span>
        <span class="sub">${when}</span>
        ${project.tags?.length ? `
          <span class="card-tags">${project.tags.slice(0, 4).map((t) =>
            `<span class="card-tag">${escape(t)}</span>`).join('')}</span>` : ''}
      </span>
    </a>`;
}

let tagFilter = null;
let showAllTags = false;

async function routeWork() {
  // Both at once: the settings carry the heading, the work carries the grid,
  // and neither waits on the other.
  const [{ items: all }, { heads }] = await Promise.all([work(), site()]);

  /*
   * One grid, in the order set in the admin — no category headings. The work
   * describes itself through its tags, which come from the projects
   * themselves; filing it into two or three buckets said less than they do.
   */
  const shown = tagFilter ? all.filter((p) => (p.tags ?? []).includes(tagFilter)) : all;

  /*
   * Behance produces a lot of tags — around sixty across a dozen projects, and
   * most of them used exactly once. All of them in a row is not a filter, it
   * is a wall, and a tag that matches one project tells you nothing you could
   * not see from the grid. So the row is the ones that actually group things,
   * and the long tail is behind a toggle.
   */
  const counts = new Map();
  all.forEach((p) => (p.tags ?? []).forEach((t) => counts.set(t, (counts.get(t) ?? 0) + 1)));
  const ranked = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const shared = ranked.filter(([, n]) => n > 1);
  const singles = ranked.filter(([, n]) => n === 1);
  // A filter that is currently applied always shows, even if it is a one-off.
  const tags = showAllTags || (tagFilter && !shared.some(([t]) => t === tagFilter))
    ? ranked
    : shared;

  view.innerHTML = `<div class="wrap">
    ${pageHead(heads, 'work', { title: "The web split in two. I didn't." })}
    ${tags.length ? `
      <div class="tag-bar">
        <button class="tag-chip ${tagFilter ? '' : 'is-on'}" data-tag="">All ${all.length}</button>
        ${tags.map(([tag, n]) => `
          <button class="tag-chip ${tagFilter === tag ? 'is-on' : ''}" data-tag="${escape(tag)}">
            ${escape(tag)}${n > 1 ? ` <span class="tag-count">${n}</span>` : ''}
          </button>`).join('')}
        ${singles.length && !showAllTags ? `
          <button class="tag-chip is-more" data-more>+${singles.length} more</button>` : ''}
        ${showAllTags ? '<button class="tag-chip is-more" data-more>Fewer</button>' : ''}
      </div>` : ''}

    <div class="grid">${shown.map(card).join('')}</div>
    ${shown.length ? '' : '<p class="lede">Nothing tagged that.</p>'}
  </div>`;

  view.querySelectorAll('[data-tag]').forEach((chip) => {
    chip.addEventListener('click', () => {
      tagFilter = chip.dataset.tag || null;
      routeWork();
    });
  });

  view.querySelector('[data-more]')?.addEventListener('click', () => {
    showAllTags = !showAllTags;
    routeWork();
  });
}

async function routeProject(id) {
  const all = await projects();
  const index = all.findIndex((p) => String(p.id) === String(id));
  const summary = all[index];
  if (!summary) {
    view.innerHTML = `<div class="wrap"><a class="back" href="#/work">${icons.left} All work</a>
      <div class="empty">No project with that id.</div></div>`;
    return;
  }

  const live = liveFor(summary);
  const when = summary.published
    ? new Date(summary.published * 1000).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })
    : '';

  // The case study is fetched per project and cached server-side; a project
  // that has not synced yet still gets a page, just a shorter one.
  let detail = null;
  try {
    const res = await fetch(`${PROJECT_API}?project=${encodeURIComponent(id)}`);
    if (res.ok) detail = (await res.json()).data;
  } catch { /* the summary is enough to render something honest */ }

  /*
   * Behance has a description field and a first text module, and people fill in
   * one or the other. Whichever carries the words becomes the standfirst, and
   * it is then dropped from the body so the page does not say it twice.
   */
  let modules = detail?.modules ?? [];

  /*
   * What you wrote here wins, and it *replaces* rather than joins. Behance's
   * own opening text block is the thing being replaced, so it comes out of the
   * body too — otherwise the page says the same thing twice, once in your
   * words at the top and once in theirs halfway down.
   */
  /*
   * A text module turned into a plain sentence. Stripping the tags with a regex
   * left the entities behind, so "Oswald &amp; Gravy" was escaped a second time
   * on the way out and rendered as "Oswald &amp;amp; Gravy". DOMParser decodes
   * them properly and, unlike innerHTML, neither runs scripts nor fetches
   * anything — which matters, because this is Behance's markup, not ours.
   */
  const plainText = (html) => (new DOMParser()
    .parseFromString(html, 'text/html').body.textContent || '')
    .replace(/\s+/g, ' ').trim();

  // Whether Behance sent a case study at all, asked before any of it is used
  // up: the only text module of a text-only project becomes the standfirst, and
  // the page would then look unsynced when it had synced perfectly.
  const hadCaseStudy = modules.length > 0;

  let standfirst = summary.intro?.trim() || detail?.description?.trim() || '';
  if (summary.intro?.trim() && modules[0]?.type === 'text') {
    modules = modules.slice(1);
  }
  if (!summary.intro && !standfirst && modules[0]?.type === 'text') {
    standfirst = plainText(modules[0].html);
    modules = modules.slice(1);
  }
  // A write-up that opens with the project's own name repeats the heading it
  // sits under, so that opening is dropped.
  const titlePrefix = new RegExp(`^${summary.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}[\\s:—-]*`, 'i');
  standfirst = standfirst.replace(titlePrefix, '').trim();

  const body = modules.map((m) => {
    if (m.type === 'text') return `<div class="module-text">${m.html}</div>`;
    if (m.type === 'image') return `<figure>
        <img class="module-image" src="${escape(m.url)}" alt="" loading="lazy">
        ${m.caption ? `<figcaption class="caption">${escape(m.caption)}</figcaption>` : ''}
      </figure>`;
    /*
     * A set posted as one block, laid out as Behance lays it out: a single row,
     * every item the same height, each taking the share of the width its flex
     * value asks for. Stacking them instead would have been a different design
     * decision from the one that was made on the project.
     */
    if (m.type === 'collection') return `<figure>
        ${(m.rows || []).map((row) => `
          <div class="collection">
            ${row.map((it) => `
              <div class="collection-item"
                   style="flex-grow:${Number(it.flex) || 1}${it.width && it.height
                     ? `;aspect-ratio:${it.width}/${it.height}` : ''}">
                <img src="${escape(it.url)}" alt="" loading="lazy">
              </div>`).join('')}
          </div>`).join('')}
        ${m.caption ? `<figcaption class="caption">${escape(m.caption)}</figcaption>` : ''}
      </figure>`;
    if (m.type === 'video' && m.url) return `<video class="module-video" controls playsinline
        ${m.poster ? `poster="${escape(m.poster)}"` : ''} src="${escape(m.url)}"></video>`;
    return '';
  }).join('');

  const chips = (items) => items?.length
    ? `<div class="chips">${items.map((t) => `<span class="chip">${escape(t)}</span>`).join('')}</div>`
    : '<span class="fact-value" style="color:var(--dim)">—</span>';

  /*
   * Written in the admin, one to a line, and absent unless it was — an empty
   * "Features" heading over nothing says less than no heading at all.
   */
  const features = summary.features?.length ? `
    <div class="features">
      <span class="stencil">What it does</span>
      <ul class="feature-list">
        ${summary.features.map((f) => `<li>${escape(f)}</li>`).join('')}
      </ul>
    </div>` : '';

  // Wraps at both ends: the work is a loop, not a list with a dead stop.
  const prev = all[(index - 1 + all.length) % all.length];
  const next = all[(index + 1) % all.length];
  const pager = all.length > 1 ? `
    <div class="pager">
      <a href="#/project/${prev.id}">
        <span class="stencil">${icons.left} Previous</span>
        <span class="pager-name">${escape(prev.name)}</span>
      </a>
      <a href="#/project/${next.id}">
        <span class="stencil">Next ${icons.right}</span>
        <span class="pager-name">${escape(next.name)}</span>
      </a>
    </div>` : '';

  /*
   * Nothing in the body has three quite different causes, and one message for
   * all of them was wrong twice over: it told a text-only project it had not
   * synced, and promised a mature-flagged one that it would "fill in on the
   * next run" when it never can.
   */
  function emptyBody() {
    // Its only module became the standfirst. Nothing is missing — say nothing.
    if (hadCaseStudy) return '';

    if (detail?.mature) {
      return `<div class="empty"><b>Behance is holding this one back.</b> The project is
        flagged as containing mature content, so Behance serves its images only to
        people signed in. The flag has to be lifted there — no amount of syncing
        here will move it.</div>`;
    }
    if (!detail) {
      return `<div class="empty"><b>This project has not synced yet.</b> The case study is
        pulled from Behance on a schedule — it will fill in on the next run.
        Everything above came from the project list, which is already cached.</div>`;
    }
    return `<div class="empty"><b>No case study on Behance.</b> This project is a cover
      and a title there, so that is what there is to show.</div>`;
  }

  const banner = summary.coverLarge || summary.cover;
  view.classList.toggle('has-hero', Boolean(banner));

  const head = `
    <div class="project-head">
      <span class="stencil">${escape(categoryLabel(summary.kind))}</span>
      <h1>${escape(summary.name)}</h1>
      ${standfirst ? `<p class="lede">${escape(standfirst)}</p>` : ''}
      <div class="btn-row">
        ${live ? `<a class="btn btn-solid" href="${live.path}">Open ${escape(live.label)} ${icons.external}</a>` : ''}
        <a class="btn" href="${escape(summary.url)}" target="_blank" rel="noopener">View on Behance ${icons.behance}</a>
      </div>
    </div>`;

  view.innerHTML = `
    ${banner ? `
      <section class="hero" style="--accent:${escape(summary.accent || 'transparent')}">
        <div class="hero-media"><img src="${escape(banner)}" alt=""></div>
        <div class="hero-back"><div class="wrap"><a class="back" href="#/work">${icons.left} All work</a></div></div>
        <div class="hero-body"><div class="wrap">${head}</div></div>
      </section>`
      : `<div class="wrap"><a class="back" href="#/work">${icons.left} All work</a>${head}</div>`}

    <div class="wrap">
    <div class="facts">
      <div class="fact"><span class="stencil">Published</span><span class="fact-value">${when}</span></div>
      <div class="fact"><span class="stencil">Made with</span>${chips(detail?.tools)}</div>
      <div class="fact"><span class="stencil">Tagged</span>${chips(summary.tags?.length ? summary.tags : detail?.tags)}</div>
    </div>

    <div class="case">
      <div class="case-body">
        ${body ? `<div class="modules">${body}</div>` : emptyBody()}
      </div>

      <aside class="case-side">${features}</aside>
    </div>

    ${pager}
  </div>`;
}

const BLOG_API = '/portfolio/api/blog.php';
const readTime = (words) => `${Math.max(1, Math.round(words / 220))} min read`;
const postDate = (value) => new Date(String(value).replace(' ', 'T'))
  .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

const tagChips = (tags) => tags?.length
  ? `<div class="chips post-tags">${tags.map((t) => `<span class="chip">${escape(t)}</span>`).join('')}</div>`
  : '';

let postsCache = null;
async function posts() {
  if (!postsCache) {
    const res = await fetch(BLOG_API);
    if (!res.ok) throw new Error(`the writing could not be read (HTTP ${res.status})`);
    postsCache = await res.json();
  }
  return postsCache;
}

/*
 * The writing is tagged the same way the work is, so it filters the same way —
 * the tag bar is the one on the Work page, driven by its own selection rather
 * than a second copy of the component.
 */
let postTag = null;

async function routeUndoStack() {
  const [all, { heads }] = await Promise.all([posts(), site()]);
  const shown = postTag ? all.filter((p) => (p.tags ?? []).includes(postTag)) : all;

  const counts = new Map();
  all.forEach((p) => (p.tags ?? []).forEach((t) => counts.set(t, (counts.get(t) ?? 0) + 1)));
  const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  view.innerHTML = `<div class="wrap">
    ${pageHead(heads, 'writing', { title: 'Twenty-seven years of ctrl+z' })}
    ${tags.length ? `
      <div class="tag-bar">
        <button class="tag-chip ${postTag ? '' : 'is-on'}" data-tag="">All ${all.length}</button>
        ${tags.map(([tag, n]) => `
          <button class="tag-chip ${postTag === tag ? 'is-on' : ''}" data-tag="${escape(tag)}">
            ${escape(tag)}${n > 1 ? ` <span class="tag-count">${n}</span>` : ''}
          </button>`).join('')}
      </div>` : ''}
    <div class="posts">
      ${shown.map((post) => `
        <a class="post-row" href="#/undo-stack/${encodeURIComponent(post.slug)}">
          <span class="post-when">${postDate(post.published)} / ${readTime(post.words)}</span>
          <h2 class="post-title">${escape(post.title)}</h2>
          <p class="post-excerpt">${escape(post.excerpt)}</p>
          ${tagChips(post.tags)}
        </a>`).join('')}
    </div>
    ${shown.length ? '' : '<p class="lede">Nothing tagged that yet.</p>'}
  </div>`;

  view.querySelectorAll('[data-tag]').forEach((chip) => {
    chip.addEventListener('click', () => {
      postTag = chip.dataset.tag || null;
      routeUndoStack();
    });
  });
}

async function routePost(slug) {
  const all = await posts();
  const index = all.findIndex((p) => p.slug === slug);
  const summary = all[index];

  const res = await fetch(`${BLOG_API}?slug=${encodeURIComponent(slug)}`);
  if (!res.ok) {
    view.innerHTML = `<div class="wrap"><a class="back" href="#/undo-stack">${icons.left} The Undo Stack</a>
      <div class="empty">No post at that address.</div></div>`;
    return;
  }
  const post = await res.json();

  const prev = index > 0 ? all[index - 1] : null;
  const next = index >= 0 && index < all.length - 1 ? all[index + 1] : null;
  const pager = (prev || next) ? `
    <div class="pager">
      ${prev ? `<a href="#/undo-stack/${encodeURIComponent(prev.slug)}">
        <span class="stencil">${icons.left} Newer</span>
        <span class="pager-name">${escape(prev.title)}</span></a>` : '<span></span>'}
      ${next ? `<a href="#/undo-stack/${encodeURIComponent(next.slug)}">
        <span class="stencil">Older ${icons.right}</span>
        <span class="pager-name">${escape(next.title)}</span></a>` : '<span></span>'}
    </div>` : '';

  // post.content is this site's own HTML, written through its own admin, so it
  // goes in as markup. Anything arriving from Behance is cut back to an
  // allowlist server-side before it gets near here.
  /*
   * The rest of the writing, beside the piece you are reading. A post used to
   * be one narrow column with the whole right half of the screen empty — and
   * the end of a post is exactly where someone is deciding whether to read
   * another one.
   */
  const others = all.filter((p) => p.slug !== slug).slice(0, 5);
  const more = others.length ? `
    <div class="more-posts">
      <span class="stencil">More from the Undo Stack</span>
      <ul class="more-list">
        ${others.map((p) => `
          <li>
            <a href="#/undo-stack/${encodeURIComponent(p.slug)}">
              <span class="more-title">${escape(p.title)}</span>
              <span class="more-when">${postDate(p.published)} / ${readTime(p.words)}</span>
            </a>
          </li>`).join('')}
      </ul>
    </div>` : '';

  // post.content is this site's own HTML, written through its own admin, so it
  // goes in as markup. Anything arriving from Behance is cut back to an
  // allowlist server-side before it gets near here.
  view.innerHTML = `<div class="wrap">
    <a class="back" href="#/undo-stack">${icons.left} The Undo Stack</a>
    <div class="page-head">
      <span class="stencil">The Undo Stack</span>
      <h1>${escape(post.title)}</h1>
    </div>
    <div class="post-meta">
      <span class="post-when">${postDate(post.published)}${summary ? ` / ${readTime(summary.words)}` : ''}</span>
      ${post.tags?.length ? `<div class="chips">${post.tags.map((t) => `<span class="chip">${escape(t)}</span>`).join('')}</div>` : ''}
    </div>
    <div class="case is-post">
      <div class="case-body"><div class="prose">${post.content}</div></div>
      <aside class="case-side">${more}</aside>
    </div>
    ${pager}
  </div>`;
}

/*
 * A page's heading and standfirst, written in the admin. The copy that used to
 * be in the markup is the fallback: if the settings are missing or the request
 * for them fails, the page still reads properly rather than losing its title.
 *
 * An empty standfirst that came from the admin is a decision — it stays empty.
 * One that is empty because nothing was fetched falls back.
 */
const HEAD_LABEL = { work: 'Work', writing: 'The Undo Stack', about: 'About' };

function pageHead(heads, page, fallback) {
  const set = heads?.[page];
  const title = set?.title?.trim() || fallback.title;
  const lede = set ? (set.lede ?? '').trim() : (fallback.lede ?? '');

  return `
    <div class="page-head">
      <span class="stencil">${escape(HEAD_LABEL[page] ?? page)}</span>
      <h1>${escape(title)}</h1>
      ${lede ? `<p class="lede">${escape(lede)}</p>` : ''}
    </div>`;
}

let siteCache = null;
async function site() {
  if (!siteCache) {
    const res = await fetch('/portfolio/api/site.php');
    siteCache = res.ok ? await res.json() : { about: null, history: [], socials: [] };
  }
  return siteCache;
}

const socialLinks = (socials, className = 'social') => socials.map((link) => `
  <a class="${className}" href="${escape(link.url)}" target="_blank" rel="noopener">${escape(link.name)} ${icons.external}</a>`).join('');

/*
 * Thirty-three rows is not a sidebar. Stacked in one, the history ran a third
 * of a page below where the writing beside it ended, so the page bottomed out
 * on a long thin list against nothing. Full width and in columns it reads as
 * what it is: an index of the work.
 */
async function routeAbout() {
  const { about, history, socials, heads } = await site();

  view.innerHTML = `<div class="wrap">
    ${pageHead(heads, 'about', { title: 'Naturally gifted designer, with a mathematical loaf' })}

    <div class="about">
      <div class="prose about-copy">${about ?? '<p class="lede">Nothing written yet.</p>'}</div>

      <aside class="about-side">
        <div class="about-block">
          <span class="stencil">Elsewhere</span>
          <div class="socials">${socialLinks(socials)}</div>
        </div>
      </aside>
    </div>

    ${history.length ? `
      <section class="worked">
        <span class="stencil">Significant clients and projects I have worked with</span>
        <ul class="history">
          ${history.map((row) => `
            <li><span class="history-year">${escape(row.year)}</span>
                <span class="history-name">${escape(row.name)}</span></li>`).join('')}
        </ul>
      </section>` : ''}
  </div>`;
}

async function render() {
  const hash = location.hash.replace(/^#\/?/, '') || 'work';
  const [route, param] = hash.split('/');

  document.querySelectorAll('.nav-link').forEach((link) => {
    link.classList.toggle('is-on', link.dataset.route === (route === 'project' ? 'work' : route));
  });

  // Only a project page has a banner; everything else keeps the page's padding.
  view.classList.remove('has-hero');
  view.innerHTML = '<div class="wrap"><p class="stencil">Loading…</p></div>';
  try {
    if (route === 'project' && param) await routeProject(param);
    else if (route === 'undo-stack' && param) await routePost(param);
    else if (route === 'undo-stack') await routeUndoStack();
    else if (route === 'about') await routeAbout();
    else await routeWork();
  } catch (err) {
    view.innerHTML = `<div class="wrap"><div class="empty"><b>Could not load.</b> ${escape(err.message)}</div></div>`;
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
render();

// The footer carries them on every page, not just About.
site().then(({ socials }) => {
  document.getElementById('footer-socials').innerHTML = socialLinks(socials, 'footer-social');
});
</script>

</body>
</html>
