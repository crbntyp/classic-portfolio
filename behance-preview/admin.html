          <button class="tool" type="button" data-cmd="bold" title="Bold"><b>B</b></button>
          <button class="tool" type="button" data-cmd="italic" title="Italic"><i>I</i></button>
          <button class="tool" type="button" data-cmd="underline" title="Underline"><u>U</u></button>
          <button class="tool" type="button" data-wrap="code" title="Inline code">&lt;/&gt;</button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-block="h2" title="Heading">H2</button>
          <button class="tool" type="button" data-block="h3" title="Subheading">H3</button>
          <button class="tool" type="button" data-block="h4" title="Small heading">H4</button>
          <button class="tool" type="button" data-block="p" title="Paragraph">¶</button>
          <button class="tool" type="button" data-block="blockquote" title="Quote">&rdquo;</button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-cmd="insertUnorderedList" title="Bullets">&bull;</button>
          <button class="tool" type="button" data-cmd="insertOrderedList" title="Numbered">1.</button>
          <button class="tool" type="button" data-cmd="outdent" title="Outdent">&lsaquo;</button>
          <button class="tool" type="button" data-cmd="indent" title="Indent">&rsaquo;</button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" id="link" title="Link">Link</button>
          <button class="tool" type="button" data-media title="Insert an image">Image</button>
          <button class="tool" type="button" data-cmd="unlink" title="Remove link">Unlink</button>
          <button class="tool" type="button" data-cmd="insertHorizontalRule" title="Divider">&mdash;</button>
          <button class="tool" type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
          <span class="tool-sep"></span>
          <button class="tool" type="button" data-cmd="undo" title="Undo">&#8630;</button>
          <button class="tool" type="button" data-cmd="redo" title="Redo">&#8631;</button>
          <span style="flex:1"></span>
          <button class="tool" type="button" id="mode" title="Edit the HTML directly">HTML</button>
        </div>
        <div class="rich" id="rich" contenteditable="true" spellcheck="true"></div>
        <textarea name="content" spellcheck="false" hidden></textarea>
      </div>

      <div class="field">
        <span class="stencil">Elsewhere</span>
        <div id="socials">${socials.map(socialRow).join('') || socialRow()}</div>
        <div><button class="btn" type="button" id="add-social">Add a link</button></div>
      </div>

      <div class="field">
        <span class="stencil">Worked on — one per line, year and name separated by a tab</span>
        <textarea name="history" class="history-input" spellcheck="false">${escape(data.history)}</textarea>
      </div>

      <div class="editor-actions">
        <button class="btn is-on" type="submit">Save</button>
        <span class="note" id="about-note"></span>
      </div>
    </form>`;

  const form = document.getElementById('about-form');
  const note = document.getElementById('about-note');
  wireEditor(form, data.about);


  /*
   * The track list comes from the folder rather than from anything stored, so
   * the picker can only ever offer files that actually exist. A saved value
   * whose file has since gone is kept as an option and marked, instead of
   * silently reverting to None — the setting is still what it is, and losing
   * it quietly on an unrelated save would be worse.
   */
  (async () => {
    const sel = document.getElementById('np-src');
    if (!sel) return;
    const chosen = data.now_playing?.src ?? '';
    let files = [];
    try {
      const r = await adminFetch('/portfolio/api/audio-list.php');
      files = (await r.json()).files || [];
    } catch { /* leave the list at None */ }

    for (const f of files) {
      const o = document.createElement('option');
      o.value = f.name;
      o.textContent = `${f.name}  (${(f.size / 1024 / 1024).toFixed(1)}MB)`;
      sel.appendChild(o);
    }
    if (chosen && !files.some((f) => f.name === chosen)) {
      const o = document.createElement('option');
      o.value = chosen;
      o.textContent = `${chosen}  (missing from /audio)`;
      sel.appendChild(o);
    }
    sel.value = chosen;
  })();

  const rows = document.getElementById('socials');
  document.getElementById('add-social').addEventListener('click', () => {
    rows.insertAdjacentHTML('beforeend', socialRow());
  });
  rows.addEventListener('click', (event) => {
    if (event.target.closest('[data-social-remove]')) event.target.closest('.social-row').remove();
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    syncBody(form);

    const links = [...rows.querySelectorAll('.social-row')]
      .map((row) => ({
        name: row.querySelector('[data-social-name]').value.trim(),
        url: row.querySelector('[data-social-url]').value.trim(),
      }))
      .filter((link) => link.name && link.url);

    /*
     * Built from the form, not from a hand-listed set of fields.
     *
     * It used to be the latter, which meant the heading and intro inputs
     * rendered above were never actually submitted — editing a page heading
     * appeared to save and changed nothing. Taking the fields from the form
     * fixes that and means a field added to the markup is submitted without
     * anyone having to remember this line.
     *
     * The three below are still set explicitly: content comes from the body
     * editor rather than a named input, and socials is assembled from rows.
     */
    const body = new URLSearchParams(new FormData(form));
    body.set('about', form.content.value);
    body.set('history', form.history.value);
    body.set('socials', JSON.stringify(links));


    say(note, 'Saving…', true);
    const saved = await adminFetch(`${SITE_API}?do=save`, { method: 'POST', body })
      .then((r) => r.json()).catch(() => ({}));
    say(note, saved.success ? 'Saved' : (saved.message || 'Did not save.'), Boolean(saved.success));
  });
}

/* ---------- routing ---------- */

const SECTIONS = {
  work: ['Work', 'What the site shows, in what order, under what banner. Behance is the source of truth for titles, covers and dates — a pull overwrites those and leaves everything here alone.'],
  writing: ['The Undo Stack', 'The writing, from the other side. This is written here rather than pulled from anywhere, so this is where it is edited.'],
  about: ['About', 'Who you are, what you have worked on, and where else to find you. None of this is synced from anywhere — it is the one part of the site that is purely yours.'],
  media: ['Media', 'Everything in the uploads folder. Drop files here and use them as banners or in a post. Anything already pointed at cannot be deleted from here.'],
  pages: ['Pages', 'The heading and the line under it on each page. Plain text — leave an intro empty and the page shows its heading on its own.'],
};

async function route() {
  const [section = 'work', param] = location.hash.replace(/^#\/?/, '').split('/');
  const known = SECTIONS[section] ? section : 'work';

  document.getElementById('heading').textContent = SECTIONS[known][0];
  document.getElementById('lede').textContent = param ? '' : SECTIONS[known][1];
  document.querySelectorAll('.nav-link').forEach((link) =>
    link.classList.toggle('is-on', link.dataset.section === known));

  if (known === 'media') {
    await renderMedia();
    return;
  }

  if (known === 'pages') {
    await renderPages();
    return;
  }

  if (known === 'about') {
    await renderAbout();
    return;
  }

  if (known === 'writing') {
    if (param) await renderPost(param);
    else await renderWriting();
    return;
  }

  if (!loaded) await load();
  else renderWork();
}

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/portfolio/api/login.php?logout', { credentials: 'same-origin' }).catch(() => {});
  // Whatever was on screen was for a session that no longer exists.
  loaded = false;
  items = [];
  renderLogin('Signed out.');
});

window.addEventListener('hashchange', route);

route();
</script>
